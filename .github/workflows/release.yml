name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag name to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build release artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION}"
          if [[ -z "${version}" ]]; then
            version="dev"
          fi

          mkdir -p dist

          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<<"${target}"

            binary_name="gcpgrlx"
            if [[ "${goos}" == "windows" ]]; then
              binary_name="${binary_name}.exe"
            fi

            package_root="gcpgrlx_${version}_${goos}_${goarch}"
            stage_dir="dist/${package_root}"
            mkdir -p "${stage_dir}"

            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -trimpath -o "${stage_dir}/${binary_name}" ./cmd/gcpgrlx

            cp README.md LICENSE "${stage_dir}/"

            if [[ "${goos}" == "windows" ]]; then
              (
                cd dist
                zip -rq "${package_root}.zip" "${package_root}"
              )
            else
              tar -C dist -czf "dist/${package_root}.tar.gz" "${package_root}"
            fi

            rm -rf "${stage_dir}"
          done

          (
            cd dist
            sha256sum ./* > checksums.txt
          )

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*
          generate_release_notes: true
