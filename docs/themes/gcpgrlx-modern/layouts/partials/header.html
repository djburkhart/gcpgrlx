<header class="mx-auto w-full max-w-7xl px-6 pt-6 md:px-10">
  <div class="site-nav flex items-center justify-between gap-4 rounded-2xl border border-slate-200 bg-white px-5 py-4 shadow-[0_8px_24px_rgba(15,23,42,0.04)]">
    <a href="{{ relURL "/" }}" class="flex items-center gap-3 text-slate-900">
      <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-950 text-sm font-bold text-white">gc</span>
      <span>
        <span class="brand-wordmark block text-base font-semibold tracking-tight">gcpgrlx</span>
        <span class="block text-xs text-slate-500">Open-source companion CLI for grlx + Google Cloud</span>
      </span>
    </a>

    <nav class="hidden items-center gap-2 md:flex">
      {{ range .Site.Menus.main }}
        {{ $isActive := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
        <a href="{{ .URL }}" class="rounded-xl border border-transparent px-4 py-2 text-sm font-medium text-slate-600 transition hover:border-slate-200 hover:bg-slate-50 hover:text-slate-900 {{ if $isActive }}active{{ end }}">
          {{ .Name }}
        </a>
      {{ end }}
    </nav>
  </div>
</header>
