<!doctype html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body class="min-h-screen text-slate-900">
  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="hero-glow absolute left-[-10rem] top-[-10rem] h-[26rem] w-[26rem] rounded-full bg-pink-200/40"></div>
    <div class="hero-glow absolute right-[-12rem] top-[-8rem] h-[24rem] w-[24rem] rounded-full bg-sky-200/40"></div>
    <div class="absolute inset-x-0 top-0 h-[28rem] bg-[linear-gradient(180deg,rgba(255,255,255,0.96),rgba(255,255,255,0))]"></div>
  </div>

  <div class="relative">
    {{ partial "header.html" . }}
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
