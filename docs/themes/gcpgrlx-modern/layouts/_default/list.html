{{ define "main" }}
  <section class="mx-auto flex w-full max-w-7xl flex-col gap-12 px-6 pb-20 pt-12 md:px-10 lg:gap-14 lg:pb-24 lg:pt-16">
    <div class="space-y-4">
      <div class="pill-label">{{ .Section | default "Docs" }}</div>
      <h1 class="text-4xl font-semibold tracking-tight text-slate-900 sm:text-5xl">{{ .Title }}</h1>
      {{ with .Description }}
        <p class="max-w-3xl text-lg leading-8 text-slate-600">{{ . }}</p>
      {{ end }}
      {{ if .Content }}
        <div class="article max-w-3xl pt-1">{{ .Content }}</div>
      {{ end }}
    </div>

    <div class="grid gap-5 md:grid-cols-2 lg:gap-6">
      {{ range .Pages.ByWeight }}
        <article class="glass-card flex h-full flex-col p-6 transition hover:-translate-y-0.5 hover:shadow-[0_24px_60px_rgba(15,23,42,0.10)] lg:p-7">
          <div class="text-sm uppercase tracking-[0.18em] text-pink-600/80">{{ .Section }}</div>
          <h2 class="mt-4 text-2xl font-semibold text-slate-900">
            <a href="{{ .RelPermalink }}" class="hover:text-pink-700">{{ .Title }}</a>
          </h2>
          <p class="mt-3 flex-1 text-sm leading-7 text-slate-600">{{ .Description }}</p>
          <div class="mt-6">
            <a href="{{ .RelPermalink }}" class="text-sm font-semibold text-pink-700 hover:text-pink-800">Open page →</a>
          </div>
        </article>
      {{ end }}
    </div>
  </section>
{{ end }}
